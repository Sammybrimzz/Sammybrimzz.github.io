
name: Deploy Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build portfolio
        run: bun run build

        
      
      - name: Inspect public files
        run: |
          echo "Files generated for the website:"
          find .output/public -maxdepth 3 -type f
          echo "Checking for index.html:"
          if [ -f .output/public/index.html ]; then
            echo "INDEX FOUND"
          else
            echo "INDEX MISSING"
          fi



      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload build
        uses: actions/upload-pages-artifact@v4
        with:
          path: .output/public

      - name: Deploy
        uses: actions/deploy-pages@v4
